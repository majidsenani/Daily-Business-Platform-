<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مُعين | وردك اليومي</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* الألوان الافتراضية (وضعية النهار) */
            --primary-color: #2d5a27;
            --accent-color: #8eb486;
            --bg-color: #f0f4f0;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
        }

        /* وضعية الليل التلقائية (تتغير بالـ JavaScript) */
        .dark-mode {
            --primary-color: #a8d5ba;
            --accent-color: #4a7c59;
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-main: #e0e0e0;
            --text-muted: #b0b0b0;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.5s, color 0.5s;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .date-time-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
        }

        #currentTime {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        #currentDate {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .progress-section {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .progress-bar-container {
            background: #e0e0e0;
            height: 10px;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        #progressBar {
            background: linear-gradient(90deg, var(--accent-color), var(--primary-color));
            width: 0%;
            height: 100%;
            transition: width 0.4s ease-out;
        }

        .tasks-container {
            display: grid;
            gap: 12px;
        }

        .task-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 2px solid transparent;
            cursor: pointer;
        }

        .task-card.completed {
            border-color: var(--accent-color);
            opacity: 0.8;
        }

        .task-info h3 {
            margin: 0;
            font-size: 1rem;
            color: var(--primary-color);
        }

        .task-info p {
            margin: 4px 0 0;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .check-circle {
            width: 26px;
            height: 26px;
            border: 2px solid #ddd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .completed .check-circle {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .completed .check-circle::after {
            content: '✓';
            color: white;
            font-size: 0.9rem;
        }

        .reset-btn {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 30px;
            font-family: 'Tajawal';
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1 style="color: var(--primary-color); margin-bottom: 5px;">مُعين</h1>
            
            <div class="date-time-box">
                <div id="currentTime">00:00:00</div>
                <div id="currentDate">جاري تحديث التاريخ...</div>
            </div>
        </header>

        <div class="progress-section">
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                <span>إنجازك اليوم</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-bar-container">
                <div id="progressBar"></div>
            </div>
        </div>

        <div class="tasks-container" id="tasksList"></div>

        <button class="reset-btn" onclick="resetTasks()">تصفير اليوم</button>
    </div>

    <script>
        const myTasks = [
            { id: 1, title: "أذكار الصباح", desc: "نور لصباحك" },
            { id: 2, title: "صلاة الضحى", desc: "صدقة عن مفاصلك" },
            { id: 3, title: "ورد القرآن", desc: "حياة لقلبك" },
            { id: 4, title: "أذكار المساء", desc: "حصن لمسائك" },
            { id: 5, title: "سورة الملك", desc: "المنجية" },
            { id: 6, title: "الاستغفار والصلاة على النبي", desc: "تفريج للهموم" }
        ];

        let completedTasks = JSON.parse(localStorage.getItem('muinProgress')) || [];

        // تحديث الوقت والتاريخ والوضع الليلي
        function updateDateTime() {
            const now = new Date();
            
            // الوقت
            const timeString = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('currentTime').innerText = timeString;
            
            // التاريخ (هجري وميلادي)
            const hijri = now.toLocaleDateString('ar-SA-u-ca-islamic-uma', { day: 'numeric', month: 'long', year: 'numeric' });
            const greg = now.toLocaleDateString('ar-SA', { day: 'numeric', month: 'long' });
            document.getElementById('currentDate').innerHTML = `${hijri}<br>${greg}`;

            // تبديل الوضع الليلي تلقائياً (من 6 مساءً لـ 6 صباحاً)
            const hour = now.getHours();
            if (hour >= 18 || hour < 6) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        function renderTasks() {
            const container = document.getElementById('tasksList');
            container.innerHTML = '';
            myTasks.forEach(task => {
                const isDone = completedTasks.includes(task.id);
                const card = document.createElement('div');
                card.className = `task-card ${isDone ? 'completed' : ''}`;
                card.onclick = () => toggleTask(task.id);
                card.innerHTML = `
                    <div class="task-info">
                        <h3>${task.title}</h3>
                        <p>${task.desc}</p>
                    </div>
                    <div class="check-circle"></div>
                `;
                container.appendChild(card);
            });
            updateProgress();
        }

        function toggleTask(id) {
            if (completedTasks.includes(id)) {
                completedTasks = completedTasks.filter(item => item !== id);
            } else {
                completedTasks.push(id);
                if (navigator.vibrate) navigator.vibrate(40);
            }
            localStorage.setItem('muinProgress', JSON.stringify(completedTasks));
            renderTasks();
        }

        function updateProgress() {
            const percent = Math.round((completedTasks.length / myTasks.length) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = percent + '%';
        }

        function resetTasks() {
            if (confirm('هل تريد مسح إنجاز اليوم؟')) {
                completedTasks = [];
                localStorage.setItem('muinProgress', JSON.stringify(completedTasks));
                renderTasks();
            }
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();
        renderTasks();
    </script>
</body>
</html>
